<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="440" viewBox="0 0 1000 440">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.box{stroke-width:2}.blue{fill:#e0f2fe;stroke:#0369a1}.amber{fill:#fef3c7;stroke:#b45309}.green{fill:#dcfce7;stroke:#15803d}.rose{fill:#ffe4e6;stroke:#be123c}.label{font:600 18px Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.small{font:16px Arial,sans-serif;fill:#475569;text-anchor:middle}.arrow{stroke:#334155;stroke-width:2.5;fill:none}.dashed{stroke-dasharray:7 6}</style></defs>
<text x="500" y="30" class="label">A seam detects a difference between neighbours</text><text x="25" y="85" class="label" style="text-anchor:start">A · Neither sheet shifted</text><rect x="55" y="130" width="110" height="125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><rect x="165" y="130" width="110" height="125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><rect x="55" y="145" width="110" height="95" fill="#deebfc" stroke="#2a78d6" stroke-width="2" stroke-dasharray=""/><rect x="165" y="145" width="110" height="95" fill="#deebfc" stroke="#2a78d6" stroke-width="2" stroke-dasharray=""/><text x="55" y="292" class="small" style="text-anchor:start">The edges meet.</text><text x="355" y="85" class="label" style="text-anchor:start">B · Only one sheet shifted</text><rect x="385" y="130" width="110" height="125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><rect x="495" y="130" width="110" height="125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><rect x="385" y="145" width="110" height="95" fill="#deebfc" stroke="#2a78d6" stroke-width="2" stroke-dasharray=""/><rect x="525" y="145" width="110" height="95" fill="#ffe3d6" stroke="#eb6834" stroke-width="2" stroke-dasharray=""/><text x="385" y="292" class="small" style="text-anchor:start">The gap exposes the fault.</text><text x="685" y="85" class="label" style="text-anchor:start">C · Both shifted together</text><rect x="715" y="130" width="110" height="125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><rect x="825" y="130" width="110" height="125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><rect x="745" y="145" width="110" height="95" fill="#ffe3d6" stroke="#eb6834" stroke-width="2" stroke-dasharray=""/><rect x="855" y="145" width="110" height="95" fill="#ffe3d6" stroke="#eb6834" stroke-width="2" stroke-dasharray=""/><text x="715" y="292" class="small" style="text-anchor:start">The edges still meet.</text><text x="500" y="350" class="small">Dashed outlines: unshifted cells. Coloured blocks: placed sheets. Schematic, not to scale.</text><text x="500" y="395" class="label">A common shift needs an outside reference. An enforced seam cannot serve as this test.</text>
</svg>