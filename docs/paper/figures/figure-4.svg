<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="620" viewBox="0 0 1100 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.box{stroke-width:2}.blue{fill:#e0f2fe;stroke:#0369a1}.amber{fill:#fef3c7;stroke:#b45309}.green{fill:#dcfce7;stroke:#15803d}.rose{fill:#ffe4e6;stroke:#be123c}.label{font:600 18px Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.small{font:16px Arial,sans-serif;fill:#475569;text-anchor:middle}.arrow{stroke:#334155;stroke-width:2.5;fill:none}.dashed{stroke-dasharray:7 6}</style></defs>
<text x="550" y="34" class="label">What one sheet supplies, and what the check compares</text><text x="268" y="70" class="small">printed corner coordinates</text><path d="M 232 84 L 142 132" class="arrow" marker-end="url(#arrow)"/><image href="sheet-corner.png" xlink:href="sheet-corner.png" x="40" y="110" width="600" height="360"/><rect x="40" y="110" width="600" height="360" fill="none" stroke="#b3b1a7" stroke-width="1.5"/><text x="340" y="496" class="small">A · the neatline corner, and the graticule the sheet prints</text><image href="sheet-datum.png" xlink:href="sheet-datum.png" x="700" y="180" width="360" height="61"/><rect x="700" y="180" width="360" height="61" fill="none" stroke="#b3b1a7" stroke-width="1.5"/><text x="880" y="278" class="small">B · the same sheet declares its datum</text><rect x="700" y="330" width="360" height="140" rx="12" class="box rose"/><text x="880" y="385" class="label">graticule_error compares A against</text><text x="880" y="408" class="label">control points read under B.</text><text x="880" y="431" class="label">A wrong datum moves both.</text><text x="550" y="556" class="small">The two operands are not independent: the printed graticule and the control points are</text><text x="550" y="581" class="small">expressed in the same declared datum, so a datum error cancels out of their difference.</text>
</svg>