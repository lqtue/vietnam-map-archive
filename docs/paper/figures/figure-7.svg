<text x="500" y="35" class="label">Dry-run fit: sheets on their cell, faulty vs corrected</text><text x="115" y="122" class="small">faulty pass</text><text x="115" y="145" class="small">437 warped</text><rect x="230" y="95" width="243" height="70" rx="4" class="box green"/><rect x="473" y="95" width="417" height="70" rx="4" class="box rose"/><text x="352" y="130" class="label">161 on cell</text><text x="682" y="130" class="label">276 over 150 m off</text><text x="115" y="227" class="small">corrected pass</text><text x="115" y="250" class="small">436 warped</text><rect x="230" y="200" width="657" height="70" rx="4" class="box green"/><rect x="887" y="200" width="3" height="70" class="box rose"/><text x="559" y="235" class="label">434 on cell</text><text x="906" y="235" class="small">2</text><text x="500" y="302" class="small">Median miss among on-cell sheets: 11 m → 10 m; worst on-cell 50 m → 95 m as 273 sheets join that population.</text><text x="500" y="325" class="small">The correction moves displaced sheets onto their cells rather than improving sheets already on them.</text>
