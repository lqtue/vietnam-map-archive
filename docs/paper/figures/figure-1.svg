<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.box{stroke-width:2}.blue{fill:#e0f2fe;stroke:#0369a1}.amber{fill:#fef3c7;stroke:#b45309}.green{fill:#dcfce7;stroke:#15803d}.rose{fill:#ffe4e6;stroke:#be123c}.label{font:600 18px Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.small{font:16px Arial,sans-serif;fill:#475569;text-anchor:middle}.arrow{stroke:#334155;stroke-width:2.5;fill:none}.dashed{stroke-dasharray:7 6}</style></defs>
<text x="500" y="30" class="label">A shared error can leave the check unchanged</text><rect x="30" y="65" width="450" height="265" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" stroke-dasharray=""/><text x="50" y="98" class="label" style="text-anchor:start">A · Before a shared shift</text><rect x="520" y="65" width="450" height="265" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" stroke-dasharray=""/><text x="540" y="98" class="label" style="text-anchor:start">B · After a shared shift</text><text x="55" y="150" class="small" style="text-anchor:start">Control</text><text x="55" y="215" class="small" style="text-anchor:start">Graticule</text><text x="545" y="150" class="small" style="text-anchor:start">Control</text><text x="545" y="215" class="small" style="text-anchor:start">Graticule</text><path d="M 250 125 V 240 M 740 125 V 240" stroke="#94a3b8" stroke-dasharray="5 5"/><circle cx="250" cy="145" r="9" fill="#2a78d6"/><circle cx="250" cy="210" r="9" fill="#2a78d6"/><path d="M 740 145 L 870 145" class="arrow" marker-end="url(#arrow)"/><path d="M 740 210 L 870 210" class="arrow" marker-end="url(#arrow)"/><circle cx="870" cy="145" r="9" fill="#eb6834"/><circle cx="870" cy="210" r="9" fill="#eb6834"/><text x="55" y="290" class="small" style="text-anchor:start">Their difference is zero.</text><text x="545" y="290" class="small" style="text-anchor:start">Both move by the same amount: still zero.</text><text x="500" y="367" class="label">(control + shift) − (graticule + shift) = control − graticule</text><text x="500" y="403" class="small">Measured in L7014: all 269 displaced sheets passed; median displacement 455 m.</text>
</svg>