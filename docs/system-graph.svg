<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1872" width="1240" role="img" aria-label="Five steps a map goes through in the Vietnam Map Archive, from finding the maps to showing them to people, with what is done and what is open at each step">
<style>
:root{--bg:#fbfaf7;--fg:#1c1b19;--mut:#6b675f;--line:#cfcabf;--card:#efece4;--card2:#f6f3ec;--card3:#e3eee8;--acc:#2f6b52;--accf:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--fg:#ece9e1;--mut:#a39e92;--line:#3a3833;--card:#26241f;--card2:#201f1b;--card3:#1f3329;--acc:#7fb89c;--accf:#12201a}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;fill:var(--fg)}
.h1{font-size:28px;font-weight:700}.mut{fill:var(--mut);font-size:14px}.hd{font-size:12px;letter-spacing:.09em;fill:var(--mut);font-weight:650}
.ttl{font-size:20px;font-weight:650}.why{font-size:14px;fill:var(--mut)}.tech{font-size:12px;fill:var(--mut);opacity:.85}
.when{font-size:14px;font-weight:650;fill:var(--acc)}.body{font-size:15px}
.num{font-size:34px;font-weight:700;fill:var(--acc)}.bn{font-size:17px;font-weight:700;fill:var(--accf)}.c{text-anchor:middle}
rect.card{fill:var(--card);stroke:var(--line)}rect.card2{fill:var(--card2);stroke:var(--line)}rect.card3{fill:var(--card3);stroke:var(--line)}
circle.dot{fill:var(--acc)}.arr{stroke:var(--fg);stroke-width:1.6}.div{stroke:var(--line);stroke-dasharray:6 5}.div2{stroke:var(--line);stroke-width:2}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--fg)"/></marker></defs>
<rect width="1240" height="1872" fill="var(--bg)"/>
<text class="h1" x="28" y="44">How the archive is built, in five steps</text><text class="mut" x="28" y="70">Each step depends on the one before it, so a mistake early on carries into everything after.</text><text class="mut" x="28" y="90">We fix the earliest broken step first. Read from the top down.</text><text class="hd" x="28" y="116">THE STEP</text><text class="hd" x="392" y="116">WHAT IS DONE</text><text class="hd" x="940" y="116">WHAT IS OPEN NOW</text><rect class="card" x="28" y="128" width="340" height="268" rx="8"/><circle class="dot" cx="60" cy="164" r="17"/><text class="bn c" x="60" y="170">1</text><text class="ttl" x="90" y="170">Find the maps and keep</text><text class="ttl" x="90" y="194">them safe</text><text class="why" x="48" y="232">We first need to know which maps exist</text><text class="why" x="48" y="250">and whether we may show them. Then we</text><text class="why" x="48" y="268">keep our own copy at a lasting address,</text><text class="why" x="48" y="286">because a scan on someone else&#x27;s website</text><text class="why" x="48" y="304">can disappear.</text><text class="tech" x="48" y="384">Technical name: Layers 0 and 1 · Sources, Holdings</text><rect class="card2" x="392" y="128" width="520" height="268" rx="8"/><text class="when" x="410" y="158">Apr 2025</text><text class="body" x="532" y="158">The first scanned sheets of Saigon went online.</text><text class="when" x="410" y="186">Feb 2026</text><text class="body" x="532" y="186">The list of maps moved from a file into a proper</text><text class="body" x="532" y="206">database.</text><text class="when" x="410" y="234">May 2026</text><text class="body" x="532" y="234">Volunteers can upload sheets in batches, and a</text><text class="body" x="532" y="254">search tool looks for more in other libraries.</text><text class="when" x="410" y="282">Apr–Aug 2026</text><text class="body" x="532" y="282">Scans are copied to our own storage, and publishing</text><text class="body" x="532" y="302">a map now starts its processing by itself.</text><text class="when" x="410" y="330">Sep 2026</text><text class="body" x="532" y="330">Whole map series appear as one layer, and every</text><text class="body" x="532" y="350">sheet has an address made from its name; old links</text><text class="body" x="532" y="370">still work.</text><rect class="card3" x="940" y="128" width="272" height="268" rx="8"/><text class="num" x="958" y="172">14</text><text class="mut" x="1008" y="172">open tasks</text><text class="body" x="958" y="198">· Record every printing of a</text><text class="body" x="958" y="218">  sheet</text><text class="body" x="958" y="244">· Settle the licence for the</text><text class="body" x="958" y="264">  Indochine 1:100,000 series</text><text class="body" x="958" y="290">· Prove that old sheet links</text><text class="body" x="958" y="310">  never break</text><text class="body" x="958" y="336">· Fill in missing titles from the</text><text class="body" x="958" y="356">  sheet itself</text><line class="arr" x1="60" y1="398" x2="60" y2="416" marker-end="url(#a)"/><rect class="card" x="28" y="420" width="340" height="206" rx="8"/><circle class="dot" cx="60" cy="456" r="17"/><text class="bn c" x="60" y="462">2</text><text class="ttl" x="90" y="462">Pin each map to the real</text><text class="ttl" x="90" y="486">ground</text><text class="why" x="48" y="524">An old map only becomes a measuring tool</text><text class="why" x="48" y="542">once it lies exactly over today&#x27;s city.</text><text class="tech" x="48" y="614">Technical name: Layer 2 · Placement</text><rect class="card2" x="392" y="420" width="520" height="206" rx="8"/><text class="when" x="410" y="450">Dec 2025</text><text class="body" x="532" y="450">Sheets can be turned square to the page.</text><text class="when" x="410" y="478">Aug 2026</text><text class="body" x="532" y="478">A map cannot be published until it can be placed.</text><text class="when" x="410" y="506">Sep 2026</text><text class="body" x="532" y="506">The 1942 Saigon–Cholon sheet went from 112 m off to</text><text class="body" x="532" y="526">34 m off.</text><rect class="card3" x="940" y="420" width="272" height="206" rx="8"/><text class="num" x="958" y="464">12</text><text class="mut" x="1008" y="464">open tasks</text><text class="body" x="958" y="490">· Keep a history of every</text><text class="body" x="958" y="510">  placement, so a mistake can be</text><text class="body" x="958" y="530">  undone</text><text class="body" x="958" y="556">· Re-place the 1:50,000 US Army</text><text class="body" x="958" y="576">  survey after a 470 m offset was</text><text class="body" x="958" y="596">  found</text><line class="arr" x1="60" y1="628" x2="60" y2="646" marker-end="url(#a)"/><rect class="card" x="28" y="650" width="340" height="268" rx="8"/><circle class="dot" cx="60" cy="686" r="17"/><text class="bn c" x="60" y="692">3</text><text class="ttl" x="90" y="692">Read what is printed, and</text><text class="ttl" x="90" y="716">make names comparable</text><text class="why" x="48" y="754">Street names, numbers and legends are</text><text class="why" x="48" y="772">the history. A program reads them and</text><text class="why" x="48" y="790">people check its work. Then a street&#x27;s</text><text class="why" x="48" y="808">different names across the years are</text><text class="why" x="48" y="826">linked, so one search finds all.</text><text class="tech" x="48" y="906">Technical name: Layers 3 and 4 · Readings, Entities</text><rect class="card2" x="392" y="650" width="520" height="268" rx="8"/><text class="when" x="410" y="680">Apr 2026</text><text class="body" x="532" y="680">The first program that reads printed names off a</text><text class="body" x="532" y="700">sheet; shapes traced by hand.</text><text class="when" x="410" y="728">May 2026</text><text class="body" x="532" y="728">Search across the whole catalogue, later merged into</text><text class="body" x="532" y="748">one search engine.</text><text class="when" x="410" y="776">Aug 2026</text><text class="body" x="532" y="776">Printed legends are read and shown as numbered</text><text class="body" x="532" y="796">points on the map.</text><text class="when" x="410" y="824">Sep 2026</text><text class="body" x="532" y="824">Reading quality can be scored against a sheet&#x27;s own</text><text class="body" x="532" y="844">printed street index.</text><text class="when" x="410" y="872">Now</text><text class="body" x="532" y="872">22 maps have been read, and 118 of their labels</text><text class="body" x="532" y="892">checked by a person.</text><rect class="card3" x="940" y="650" width="272" height="268" rx="8"/><text class="num" x="958" y="694">27</text><text class="mut" x="1008" y="694">open tasks</text><text class="body" x="958" y="720">· Read the whole placed archive</text><text class="body" x="958" y="746">· Find city blocks and rivers</text><text class="body" x="958" y="766">  from the ink colours</text><text class="body" x="958" y="792">· Build a place-name dictionary</text><text class="body" x="958" y="812">  that spans the years</text><text class="body" x="958" y="838">· Pair old and new street names</text><line class="arr" x1="60" y1="920" x2="60" y2="938" marker-end="url(#a)"/><rect class="card" x="28" y="942" width="340" height="268" rx="8"/><circle class="dot" cx="60" cy="978" r="17"/><text class="bn c" x="60" y="984">4</text><text class="ttl" x="90" y="984">Show it to people</text><text class="why" x="48" y="1022">All of the above matters only if a</text><text class="why" x="48" y="1040">visitor can explore it.</text><text class="tech" x="48" y="1198">Technical name: Surfaces</text><rect class="card2" x="392" y="942" width="520" height="268" rx="8"/><text class="when" x="410" y="972">Jun 2025</text><text class="body" x="532" y="972">A time slider, so the maps could be moved through</text><text class="body" x="532" y="992">instead of picked from a list.</text><text class="when" x="410" y="1020">Feb 2026</text><text class="body" x="532" y="1020">Stories: routes across the map with text and stops.</text><text class="when" x="410" y="1048">Jun 2026</text><text class="body" x="532" y="1048">A map page you can search, and a trip page that a</text><text class="body" x="532" y="1068">printed QR code opens.</text><text class="when" x="410" y="1096">Sep 2026</text><text class="body" x="532" y="1096">The site went from 23 pages to 16, with a dark theme</text><text class="body" x="532" y="1116">and one Tools menu.</text><text class="when" x="410" y="1144">Oct 2026</text><text class="body" x="532" y="1144">A prototype stacks six District 4 maps by year and</text><text class="body" x="532" y="1164">shows how each was made; it is not on the main site</text><text class="body" x="532" y="1184">yet.</text><rect class="card3" x="940" y="942" width="272" height="268" rx="8"/><text class="num" x="958" y="986">3</text><text class="mut" x="990" y="986">open tasks</text><text class="body" x="958" y="1012">· Check that searching a place</text><text class="body" x="958" y="1032">  name finds it on the live site</text><text class="body" x="958" y="1058">· Show staff the next step for</text><text class="body" x="958" y="1078">  each sheet</text><text class="body" x="958" y="1104">· Decide whether the old inspect</text><text class="body" x="958" y="1124">  page is still needed</text><line class="arr" x1="60" y1="1212" x2="60" y2="1230" marker-end="url(#a)"/><rect class="card" x="28" y="1234" width="340" height="264" rx="8"/><circle class="dot" cx="60" cy="1270" r="17"/><text class="bn c" x="60" y="1276">5</text><text class="ttl" x="90" y="1276">Not started yet</text><text class="why" x="48" y="1314">Nothing here is built. Each piece rests</text><text class="why" x="48" y="1332">on the steps above, so it waits for</text><text class="why" x="48" y="1350">them.</text><text class="tech" x="48" y="1486">Technical name: Layer 5, and the planned Surfaces</text><rect class="card2" x="392" y="1234" width="520" height="264" rx="8"/><text class="when" x="410" y="1264">Sep 2026</text><text class="body" x="532" y="1264">Only groundwork: one sheet (1882) taken all the way</text><text class="body" x="532" y="1284">from scan to traced shapes, and a research paper</text><text class="body" x="532" y="1304">under way.</text><rect class="card3" x="940" y="1234" width="272" height="264" rx="8"/><text class="num" x="958" y="1278">16</text><text class="mut" x="1008" y="1278">open tasks</text><text class="body" x="958" y="1304">· Link each statement to its</text><text class="body" x="958" y="1324">  trail of evidence</text><text class="body" x="958" y="1350">· Compare what different sheets</text><text class="body" x="958" y="1370">  say about the same place</text><text class="body" x="958" y="1396">· A walking tour of District 4</text><text class="body" x="958" y="1422">· A year slider over the placed</text><text class="body" x="958" y="1442">  sheets</text><text class="body" x="958" y="1468">· Building heights and a 3D city</text><line class="div" x1="28" y1="1506" x2="1212" y2="1506"/><rect class="card" x="28" y="1536" width="340" height="156" rx="8"/><text class="ttl" x="48" y="1578">Keep it running</text><text class="why" x="48" y="1616">Building, publishing and testing the</text><text class="why" x="48" y="1634">site, and the language of its screens.</text><text class="tech" x="48" y="1680">Technical name: Outside the model</text><rect class="card2" x="392" y="1536" width="520" height="156" rx="8"/><text class="when" x="410" y="1566">Aug 2026</text><text class="body" x="532" y="1566">Dead code removed; the machines that read sheets</text><text class="body" x="532" y="1586">hold no database password.</text><text class="when" x="410" y="1614">Now</text><text class="body" x="532" y="1614">374 automated checks run before a change is</text><text class="body" x="532" y="1634">accepted.</text><rect class="card3" x="940" y="1536" width="272" height="156" rx="8"/><text class="num" x="958" y="1580">9</text><text class="mut" x="990" y="1580">open tasks</text><text class="body" x="958" y="1606">· Add a second key for the AI</text><text class="body" x="958" y="1626">  reading service</text><text class="body" x="958" y="1652">· Keep preview sites configured</text><text class="hd" x="28" y="1724">HOW THE SITE ITSELF GREW (each version number is in CHANGELOG.md)</text><line class="div2" x1="28" y1="1746" x2="1212" y2="1746"/><circle class="dot" cx="34.0" cy="1746" r="6"/><text class="when" x="28.0" y="1772">Apr 2025</text><text class="body" x="28.0" y="1792">one web page of scans</text><circle class="dot" cx="234.8" cy="1746" r="6"/><text class="when" x="228.8" y="1772">Oct 2025</text><text class="body" x="228.8" y="1792">rebuilt as a real</text><text class="body" x="228.8" y="1810">application</text><circle class="dot" cx="435.6" cy="1746" r="6"/><text class="when" x="429.6" y="1772">Feb 2026</text><text class="body" x="429.6" y="1792">accounts, database,</text><text class="body" x="429.6" y="1810">stories</text><circle class="dot" cx="636.4000000000001" cy="1746" r="6"/><text class="when" x="630.4000000000001" y="1772">Apr 2026</text><text class="body" x="630.4000000000001" y="1792">catalogue, tracing,</text><text class="body" x="630.4000000000001" y="1810">first text reading</text><circle class="dot" cx="837.2" cy="1746" r="6"/><text class="when" x="831.2" y="1772">Aug 2026</text><text class="body" x="831.2" y="1792">automatic processing</text><text class="body" x="831.2" y="1810">queue</text><circle class="dot" cx="1038.0" cy="1746" r="6"/><text class="when" x="1032.0" y="1772">Sep 2026</text><text class="body" x="1032.0" y="1792">one site, names as</text><text class="body" x="1032.0" y="1810">addresses</text><text class="mut" x="28" y="1844">Open-task counts come from the project roadmap, as of the last time this picture was drawn. The engineer view of the same picture is system-graph-technical.svg.</text>
</svg>