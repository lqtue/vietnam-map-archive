<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1982" width="1240" role="img" aria-label="Seven steps a map goes through in the Vietnam Map Archive, from finding the maps to showing them to people, with what is done and what is open at each step">
<style>
:root{--bg:#fbfaf7;--fg:#1c1b19;--mut:#6b675f;--line:#cfcabf;--card:#efece4;--card2:#f6f3ec;--card3:#e3eee8;--acc:#2f6b52;--accf:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--fg:#ece9e1;--mut:#a39e92;--line:#3a3833;--card:#26241f;--card2:#201f1b;--card3:#1f3329;--acc:#7fb89c;--accf:#12201a}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;fill:var(--fg)}
.h1{font-size:28px;font-weight:700}.mut{fill:var(--mut);font-size:14px}.hd{font-size:12px;letter-spacing:.09em;fill:var(--mut);font-weight:650}
.ttl{font-size:20px;font-weight:650}.why{font-size:14px;fill:var(--mut)}.tech{font-size:12px;fill:var(--mut);opacity:.85}
.when{font-size:14px;font-weight:650;fill:var(--acc)}.body{font-size:15px}
.num{font-size:34px;font-weight:700;fill:var(--acc)}.bn{font-size:17px;font-weight:700;fill:var(--accf)}.c{text-anchor:middle}
rect.card{fill:var(--card);stroke:var(--line)}rect.card2{fill:var(--card2);stroke:var(--line)}rect.card3{fill:var(--card3);stroke:var(--line)}
circle.dot{fill:var(--acc)}.arr{stroke:var(--fg);stroke-width:1.6}.div{stroke:var(--line);stroke-dasharray:6 5}.div2{stroke:var(--line);stroke-width:2}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--fg)"/></marker></defs>
<rect width="1240" height="1982" fill="var(--bg)"/>
<text class="h1" x="28" y="44">How the archive is built, in seven steps</text><text class="mut" x="28" y="70">Each step depends on the one before it, so a mistake early on carries into everything after.</text><text class="mut" x="28" y="90">We fix the earliest broken step first. Read from the top down.</text><text class="hd" x="28" y="116">THE STEP</text><text class="hd" x="392" y="116">WHAT IS DONE</text><text class="hd" x="940" y="116">WHAT IS OPEN NOW</text><rect class="card" x="28" y="128" width="340" height="174" rx="8"/><circle class="dot" cx="60" cy="164" r="17"/><text class="bn c" x="60" y="170">1</text><text class="ttl" x="90" y="170">Find the maps</text><text class="why" x="48" y="208">We first need to know which maps exist,</text><text class="why" x="48" y="226">who made them, who holds them and</text><text class="why" x="48" y="244">whether we may show them.</text><text class="tech" x="48" y="290">Technical name: Layer 0 · Sources</text><rect class="card2" x="392" y="128" width="520" height="174" rx="8"/><text class="when" x="410" y="158">Apr 2025</text><text class="body" x="532" y="158">The first scanned sheets of Saigon went online.</text><text class="when" x="410" y="186">May 2026</text><text class="body" x="532" y="186">Volunteers can upload sheets in batches, and a</text><text class="body" x="532" y="206">search tool looks for more in other libraries.</text><text class="when" x="410" y="234">Sep 2026</text><text class="body" x="532" y="234">Whole map series appear as one layer, including</text><text class="body" x="532" y="254">sheets we do not hold yet.</text><rect class="card3" x="940" y="128" width="272" height="174" rx="8"/><text class="num" x="958" y="172">9</text><text class="mut" x="990" y="172">open tasks</text><text class="body" x="958" y="198">· Record every printing of a</text><text class="body" x="958" y="218">  sheet</text><text class="body" x="958" y="244">· Settle the licence for the</text><text class="body" x="958" y="264">  Indochine 1:100,000 series</text><line class="arr" x1="60" y1="304" x2="60" y2="322" marker-end="url(#a)"/><rect class="card" x="28" y="326" width="340" height="174" rx="8"/><circle class="dot" cx="60" cy="362" r="17"/><text class="bn c" x="60" y="368">2</text><text class="ttl" x="90" y="368">Keep them safe and online</text><text class="why" x="48" y="406">A scan on someone else&#x27;s website can</text><text class="why" x="48" y="424">disappear. We keep our own copy and give</text><text class="why" x="48" y="442">each map a lasting web address.</text><text class="tech" x="48" y="488">Technical name: Layer 1 · Holdings</text><rect class="card2" x="392" y="326" width="520" height="174" rx="8"/><text class="when" x="410" y="356">Feb 2026</text><text class="body" x="532" y="356">The list of maps moved from a file into a proper</text><text class="body" x="532" y="376">database.</text><text class="when" x="410" y="404">Apr–Aug 2026</text><text class="body" x="532" y="404">Scans are copied to our own storage, and publishing</text><text class="body" x="532" y="424">a map now starts its processing by itself.</text><text class="when" x="410" y="452">Sep 2026</text><text class="body" x="532" y="452">Every sheet has an address made from its name, and</text><text class="body" x="532" y="472">old links still work.</text><rect class="card3" x="940" y="326" width="272" height="174" rx="8"/><text class="num" x="958" y="370">5</text><text class="mut" x="990" y="370">open tasks</text><text class="body" x="958" y="396">· Prove that old sheet links</text><text class="body" x="958" y="416">  never break</text><text class="body" x="958" y="442">· Fill in missing titles from the</text><text class="body" x="958" y="462">  sheet itself</text><line class="arr" x1="60" y1="502" x2="60" y2="520" marker-end="url(#a)"/><rect class="card" x="28" y="524" width="340" height="206" rx="8"/><circle class="dot" cx="60" cy="560" r="17"/><text class="bn c" x="60" y="566">3</text><text class="ttl" x="90" y="566">Pin each map to the real</text><text class="ttl" x="90" y="590">ground</text><text class="why" x="48" y="628">An old map only becomes a measuring tool</text><text class="why" x="48" y="646">once it lies exactly over today&#x27;s city.</text><text class="tech" x="48" y="718">Technical name: Layer 2 · Placement</text><rect class="card2" x="392" y="524" width="520" height="206" rx="8"/><text class="when" x="410" y="554">Dec 2025</text><text class="body" x="532" y="554">Sheets can be turned square to the page.</text><text class="when" x="410" y="582">Aug 2026</text><text class="body" x="532" y="582">A map cannot be published until it can be placed.</text><text class="when" x="410" y="610">Sep 2026</text><text class="body" x="532" y="610">The 1942 Saigon–Cholon sheet went from 112 m off to</text><text class="body" x="532" y="630">34 m off.</text><rect class="card3" x="940" y="524" width="272" height="206" rx="8"/><text class="num" x="958" y="568">12</text><text class="mut" x="1008" y="568">open tasks</text><text class="body" x="958" y="594">· Keep a history of every</text><text class="body" x="958" y="614">  placement, so a mistake can be</text><text class="body" x="958" y="634">  undone</text><text class="body" x="958" y="660">· Re-place the 1:50,000 US Army</text><text class="body" x="958" y="680">  survey after a 470 m offset was</text><text class="body" x="958" y="700">  found</text><line class="arr" x1="60" y1="732" x2="60" y2="750" marker-end="url(#a)"/><rect class="card" x="28" y="754" width="340" height="198" rx="8"/><circle class="dot" cx="60" cy="790" r="17"/><text class="bn c" x="60" y="796">4</text><text class="ttl" x="90" y="796">Read what is printed on</text><text class="ttl" x="90" y="820">them</text><text class="why" x="48" y="858">Street names, numbers and legends are</text><text class="why" x="48" y="876">the history. A program reads them and</text><text class="why" x="48" y="894">people check its work.</text><text class="tech" x="48" y="940">Technical name: Layer 3 · Readings</text><rect class="card2" x="392" y="754" width="520" height="198" rx="8"/><text class="when" x="410" y="784">Apr 2026</text><text class="body" x="532" y="784">The first program that reads printed names off a</text><text class="body" x="532" y="804">sheet; shapes traced by hand.</text><text class="when" x="410" y="832">Sep 2026</text><text class="body" x="532" y="832">Reading quality can be scored against a sheet&#x27;s own</text><text class="body" x="532" y="852">printed street index.</text><text class="when" x="410" y="880">Now</text><text class="body" x="532" y="880">22 maps have been read, and 118 of their labels</text><text class="body" x="532" y="900">checked by a person.</text><rect class="card3" x="940" y="754" width="272" height="198" rx="8"/><text class="num" x="958" y="798">20</text><text class="mut" x="1008" y="798">open tasks</text><text class="body" x="958" y="824">· Read the whole placed archive</text><text class="body" x="958" y="850">· Find city blocks and rivers</text><text class="body" x="958" y="870">  from the ink colours</text><line class="arr" x1="60" y1="954" x2="60" y2="972" marker-end="url(#a)"/><rect class="card" x="28" y="976" width="340" height="198" rx="8"/><circle class="dot" cx="60" cy="1012" r="17"/><text class="bn c" x="60" y="1018">5</text><text class="ttl" x="90" y="1018">Make names comparable</text><text class="ttl" x="90" y="1042">across years</text><text class="why" x="48" y="1080">A street changes name; a place is</text><text class="why" x="48" y="1098">spelled several ways. We link them so</text><text class="why" x="48" y="1116">one search finds all.</text><text class="tech" x="48" y="1162">Technical name: Layer 4 · Entities</text><rect class="card2" x="392" y="976" width="520" height="198" rx="8"/><text class="when" x="410" y="1006">May 2026</text><text class="body" x="532" y="1006">Search across the whole catalogue, later merged into</text><text class="body" x="532" y="1026">one search engine.</text><text class="when" x="410" y="1054">Aug 2026</text><text class="body" x="532" y="1054">Printed legends are read and shown as numbered</text><text class="body" x="532" y="1074">points on the map.</text><rect class="card3" x="940" y="976" width="272" height="198" rx="8"/><text class="num" x="958" y="1020">8</text><text class="mut" x="990" y="1020">open tasks</text><text class="body" x="958" y="1046">· Build a place-name dictionary</text><text class="body" x="958" y="1066">  that spans the years</text><text class="body" x="958" y="1092">· Pair old and new street names</text><line class="arr" x1="60" y1="1176" x2="60" y2="1194" marker-end="url(#a)"/><rect class="card" x="28" y="1198" width="340" height="174" rx="8"/><circle class="dot" cx="60" cy="1234" r="17"/><text class="bn c" x="60" y="1240">6</text><text class="ttl" x="90" y="1240">Make claims we can prove</text><text class="why" x="48" y="1278">A statement such as &quot;this street was</text><text class="why" x="48" y="1296">here in 1882&quot; should lead to the exact</text><text class="why" x="48" y="1314">spot on the exact sheet.</text><text class="tech" x="48" y="1360">Technical name: Layer 5 · Assertions</text><rect class="card2" x="392" y="1198" width="520" height="174" rx="8"/><text class="when" x="410" y="1228">Feb 2026</text><text class="body" x="532" y="1228">Stories: routes across the map with text and stops.</text><text class="when" x="410" y="1256">Sep 2026</text><text class="body" x="532" y="1256">One sheet (1882) taken all the way from scan to</text><text class="body" x="532" y="1276">traced shapes; a research paper is under way.</text><rect class="card3" x="940" y="1198" width="272" height="174" rx="8"/><text class="num" x="958" y="1242">5</text><text class="mut" x="990" y="1242">open tasks</text><text class="body" x="958" y="1268">· Link each statement to its</text><text class="body" x="958" y="1288">  trail of evidence</text><text class="body" x="958" y="1314">· Compare what different sheets</text><text class="body" x="958" y="1334">  say about the same place</text><line class="arr" x1="60" y1="1374" x2="60" y2="1392" marker-end="url(#a)"/><rect class="card" x="28" y="1396" width="340" height="212" rx="8"/><circle class="dot" cx="60" cy="1432" r="17"/><text class="bn c" x="60" y="1438">7</text><text class="ttl" x="90" y="1438">Show it to people</text><text class="why" x="48" y="1476">All of the above matters only if a</text><text class="why" x="48" y="1494">visitor can explore it.</text><text class="tech" x="48" y="1596">Technical name: Surfaces</text><rect class="card2" x="392" y="1396" width="520" height="212" rx="8"/><text class="when" x="410" y="1426">Jun 2026</text><text class="body" x="532" y="1426">A map page you can search, and a trip page that a</text><text class="body" x="532" y="1446">printed QR code opens.</text><text class="when" x="410" y="1474">Sep 2026</text><text class="body" x="532" y="1474">The site went from 23 pages to 16, with a dark theme</text><text class="body" x="532" y="1494">and one Tools menu.</text><rect class="card3" x="940" y="1396" width="272" height="212" rx="8"/><text class="num" x="958" y="1440">13</text><text class="mut" x="1008" y="1440">open tasks</text><text class="body" x="958" y="1466">· A walking tour of District 4</text><text class="body" x="958" y="1492">· A year slider to move through</text><text class="body" x="958" y="1512">  time</text><text class="body" x="958" y="1538">· A 3D stack of six District 4</text><text class="body" x="958" y="1558">  maps, with how each was made</text><text class="body" x="958" y="1578">  (prototype, not published)</text><line class="div" x1="28" y1="1616" x2="1212" y2="1616"/><rect class="card" x="28" y="1646" width="340" height="156" rx="8"/><text class="ttl" x="48" y="1688">Keep it running</text><text class="why" x="48" y="1726">Building, publishing and testing the</text><text class="why" x="48" y="1744">site, and the language of its screens.</text><text class="tech" x="48" y="1790">Technical name: Outside the model</text><rect class="card2" x="392" y="1646" width="520" height="156" rx="8"/><text class="when" x="410" y="1676">Aug 2026</text><text class="body" x="532" y="1676">Dead code removed; the machines that read sheets</text><text class="body" x="532" y="1696">hold no database password.</text><text class="when" x="410" y="1724">Now</text><text class="body" x="532" y="1724">374 automated checks run before a change is</text><text class="body" x="532" y="1744">accepted.</text><rect class="card3" x="940" y="1646" width="272" height="156" rx="8"/><text class="num" x="958" y="1690">9</text><text class="mut" x="990" y="1690">open tasks</text><text class="body" x="958" y="1716">· Add a second key for the AI</text><text class="body" x="958" y="1736">  reading service</text><text class="body" x="958" y="1762">· Keep preview sites configured</text><text class="hd" x="28" y="1834">HOW THE SITE ITSELF GREW (each version number is in CHANGELOG.md)</text><line class="div2" x1="28" y1="1856" x2="1212" y2="1856"/><circle class="dot" cx="34.0" cy="1856" r="6"/><text class="when" x="28.0" y="1882">Apr 2025</text><text class="body" x="28.0" y="1902">one web page of scans</text><circle class="dot" cx="234.8" cy="1856" r="6"/><text class="when" x="228.8" y="1882">Oct 2025</text><text class="body" x="228.8" y="1902">rebuilt as a real</text><text class="body" x="228.8" y="1920">application</text><circle class="dot" cx="435.6" cy="1856" r="6"/><text class="when" x="429.6" y="1882">Feb 2026</text><text class="body" x="429.6" y="1902">accounts, database,</text><text class="body" x="429.6" y="1920">stories</text><circle class="dot" cx="636.4000000000001" cy="1856" r="6"/><text class="when" x="630.4000000000001" y="1882">Apr 2026</text><text class="body" x="630.4000000000001" y="1902">catalogue, tracing,</text><text class="body" x="630.4000000000001" y="1920">first text reading</text><circle class="dot" cx="837.2" cy="1856" r="6"/><text class="when" x="831.2" y="1882">Aug 2026</text><text class="body" x="831.2" y="1902">automatic processing</text><text class="body" x="831.2" y="1920">queue</text><circle class="dot" cx="1038.0" cy="1856" r="6"/><text class="when" x="1032.0" y="1882">Sep 2026</text><text class="body" x="1032.0" y="1902">one site, names as</text><text class="body" x="1032.0" y="1920">addresses</text><text class="mut" x="28" y="1954">Open-task counts come from the project roadmap, as of the last time this picture was drawn. The engineer view of the same picture is system-graph-technical.svg.</text>
</svg>