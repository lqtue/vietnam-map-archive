name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # svelte-check and the build resolve $env/static/*, so the names have to
      # exist. .env.test holds the Supabase CLI's public demo values.
      - run: cp .env.test .env
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      # The suite is 354 checks in two halves. 336 of them are pure — they only
      # ride the Playwright runner because it is already installed, and need no
      # server, no network and no database. The other 18 (smoke.spec.ts,
      # catalog-series.spec.ts) drive a browser against a running dev server and
      # read the real Supabase project through the PUBLIC_* values.
      #
      # Those 18 cannot run here honestly. `cp .env.test .env` above points the
      # app at http://127.0.0.1:54421, the local Supabase stack, which does not
      # exist on a CI runner — so every browser check would fail on an empty
      # database rather than on a regression. Supplying the production values as
      # secrets would fix the failure and buy a worse problem: a read-only suite
      # that green-lights a PR only while the live project happens to hold the
      # rows it expects, and that leaks the project to every fork's PR run. So
      # CI runs the half that is deterministic, and the browser half stays a
      # local/preview gate (`npm run test`, or SMOKE_BASE_URL against a deploy).
      - run: npx playwright install --with-deps chromium
      - run: npm run test
        env:
          PURE_ONLY: '1'

  # The write half, which `verify` above deliberately cannot do: 31 checks that
  # sign in, POST through the server routes and read the rows back. They need a
  # real Supabase — auth, PostgREST and the `extensions` PostGIS schema the
  # place migrations call into — so they get the local stack, seeded fresh.
  #
  # A GitHub runner has Docker natively, which is the whole reason this lives
  # here rather than on a laptop. `.env.test` holds the CLI's published demo
  # keys, so nothing secret crosses a fork's PR run, and `write.spec.ts` throws
  # unless PUBLIC_SUPABASE_URL is loopback — production cannot be reached from
  # this job even by accident.
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          # Release discovery otherwise uses GitHub's small anonymous quota.
          github-token: ${{ github.token }}
      - run: npm ci
      - run: cp .env.test .env
      # Same command as a laptop runs, so the two stacks cannot drift:
      # `supabase start -x vector -x logflare` plus the fixture seed.
      - run: npm run db:test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:write

  # Three checks that used to run nowhere, so a break in them went unseen. They
  # need no secrets and no database, and each finishes in about a minute.
  #
  # The Python self-checks are assert-based scripts under scripts/ and work/.
  # run_selfchecks.py lists the ones that run offline and the ones it skips on
  # purpose (they need GDAL or torch), and fails if a new self-check is in
  # neither list. Pins come from the seg requirements file, which includes the
  # OCR one.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            work/seg-requirements-cpu.txt
            work/ocr/requirements.txt
      - run: pip install -r work/seg-requirements-cpu.txt
      - run: python scripts/run_selfchecks.py

  # worker/ is its own Cloudflare Worker with its own lockfile, so the root
  # `npm run check` never sees it.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check

  # docs/workspace-model.json says which layer owns each folder; the checker
  # confirms every declared path exists and every compatibility link resolves.
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_workspace_layout.py
