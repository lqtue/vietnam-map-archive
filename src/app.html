<!doctype html>
<html lang="%vma.lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#eae7e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1815" media="(prefers-color-scheme: dark)" />
    <!-- Replay the reader's theme choice before the first paint. Without this
         a reader who picked dark gets a light flash on every navigation that
         reloads the document, because the stylesheet's default is
         `color-scheme: light dark` and the attribute only lands once the
         bundle runs. Raw string, same key as $lib/core/utils/theme.ts. -->
    <script nonce="%sveltekit.nonce%">
      try {
        var t = localStorage.getItem('vma-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {
        /* storage blocked: fall back to the system preference */
      }
    </script>
    <!-- Every map view fetches its rows from Supabase and then dozens of tiles
         from the IIIF worker. Both handshakes measured 70-180ms and neither
         starts until the bundle asks, so they sit at the head of the critical
         path. Warming them costs one connection each. -->
    <link rel="preconnect" href="https://iiif.maparchive.vn" crossorigin />
    <link rel="preconnect" href="https://trioykjhhwrruwjsklfo.supabase.co" crossorigin />
    <!-- The fonts are ours now — `src/styles/fonts.css`, files in
         `static/fonts/`. They used to come from `fonts.googleapis.com`: a
         render-blocking stylesheet on one third-party origin pointing at files
         on another, so two handshakes and an extra round trip stood between the
         HTML and the first painted word. That is what the two `preconnect`
         hints here were for, and both are gone with it.

         These two are on every page above the fold — body text and the display
         face — and they are the only ones worth preloading: the rest of the
         subsets are fetched only if a page needs them. -->
    <link
      rel="preload"
      href="/fonts/inter-400-800-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/be-vietnam-pro-800-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
