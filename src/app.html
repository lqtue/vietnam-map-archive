<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#eae7df" />

    <!-- Every map view fetches its rows from Supabase and then dozens of tiles
         from the IIIF worker. Both handshakes measured 70-180ms and neither
         starts until the bundle asks, so they sit at the head of the critical
         path. Warming them costs one connection each. -->
    <link rel="preconnect" href="https://iiif.maparchive.vn" crossorigin />
    <link rel="preconnect" href="https://trioykjhhwrruwjsklfo.supabase.co" crossorigin />

    <!-- The three faces are self-hosted from /fonts, so there is no third
         origin to preconnect and no render-blocking stylesheet. Only the latin
         subset of the body face is on the critical path. -->
    <link
      rel="preload"
      href="/fonts/be-vietnam-pro-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    %sveltekit.head%

    <!-- Google's website translator, loaded ONLY for a visitor who has actually
         asked for Vietnamese. /profile's language toggle sets this cookie and
         reloads. It used to load unconditionally on every page, render nothing
         (there was no mount element anywhere in the app) and block the head. -->
    <script>
      if (document.cookie.indexOf('googtrans=/en/vi') !== -1) {
        window.googleTranslateElementInit = function () {
          new google.translate.TranslateElement(
            { pageLanguage: 'en', includedLanguages: 'en,vi', autoDisplay: false },
            'google_translate_element'
          );
        };
        var s = document.createElement('script');
        s.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        s.async = true;
        document.head.appendChild(s);
      }
    </script>
    <style>
      body > .skiptranslate {
        display: none !important;
      }
      body {
        top: 0 !important;
      }
    </style>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="google_translate_element" hidden></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
